[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leagueloop-nexus"
version = "0.1.0"
description = "LeagueLoop Nexus — an intelligent League Client companion centered on Champ Select, recommendation, automation, and transparent decision-making."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Malcolmdotpeewhy" }]
dependencies = [
    "PySide6>=6.5",
    "httpx>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "psutil>=5.9",
    "pyinstaller>=6.0",
]

[project.scripts]
league-loop-nexus = "nexus.app.bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "ui: tests that require a Qt application (offscreen)",
]
